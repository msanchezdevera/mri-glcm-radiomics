name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit and API tests
        run: pytest -q
      - name: Agent evals (offline, mock LLM)
        run: python -m evals.run --min-pass 0.9
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/evals.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mri-radiomics-agent .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api mri-radiomics-agent
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -F "file=@assets/samples/glioma.jpg;type=image/jpeg" localhost:8000/predict
